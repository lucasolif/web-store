spring:
  application:
    name: api-produto
  datasource:
    url: ${BANCO_URL:jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
    username: ${BANCO_USUARIO:root}
    password: ${BANCO_SENHA:D8hj0ptr}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${PRODUCT_IMAGE_MAX_SIZE:5MB}
      max-request-size: ${PRODUCT_IMAGE_MAX_REQUEST_SIZE:6MB}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:null}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  product-images:
    directory: ${PRODUCT_IMAGE_DIRECTORY:uploads/products}
    max-size: ${PRODUCT_IMAGE_MAX_SIZE:5MB}
    public-path: /api/product-images

server:
  port: ${PORTA_SERVIDOR:8081}

logging:
  level:
    org.hibernate.SQL: INFO
